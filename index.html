<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully ignore Vite WebSocket HMR errors in iframe/preview environments where HMR is disabled
      window.addEventListener('error', function(event) {
        if (event?.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event?.reason || '') + ' ' + String(event?.reason?.stack || '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dear Diary - AI Personal Journal & Mood Companion</title>

    <meta property="og:description" content="A private, safe, and beautiful AI-powered personal diary mobile app with mood tracking, reflective companion, memories, voice notes, and emotional insights." />

  </head>
